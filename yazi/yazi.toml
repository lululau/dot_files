[mgr]
linemode = 'full'
sort_dir_first = false
sort_by = 'mtime'
sort_reverse = true

[opener]
edit = [
	{ run = 'nvim "$@"', block = true },
]
play = [
	{ run = 'open "$@"' },
]
open = [
	{ run = 'open "$@"', desc = "Open" },
]

[plugin]
prepend_previewers = [
  { name = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
  { name = "*.markdown", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
  { name = "*.docx", run = 'piper -- markitdown "$1" | CLICOLOR_FORCE=1 glow -w=$w -s=dark' },
  { name = "*.doc", run = 'piper -- markitdown "$1" | CLICOLOR_FORCE=1 glow -w=$w -s=dark' },
  { name = "*.csv", run = 'duckdb' },
  { name = "*.xlsx", run = 'duckdb' }
]

prepend_preloaders = [  
  { name = "*.csv", run = "duckdb", multi = false },  
  { name = "*.tsv", run = "duckdb", multi = false },  
  { name = "*.xlsx", run = "duckdb", multi = false }
]
